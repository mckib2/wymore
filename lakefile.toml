name = "mbse"
version = "0.1.0"
defaultTargets = ["mbse", "Appendix3"]
# Mathlib 4.35 enables requiresModuleSystem; this package still uses classic headers.
allowNonModules = true

[[lean_lib]]
name = "Mbse"
allowNonModules = true

[[require]]
name = "mathlib"
path = "/home/nicholas/mathlib4"

[[lean_lib]]
name = "MbseLTS"
roots = ["MbseLTS"]

[[lean_lib]]
name = "Appendix3"

[[lean_exe]]
name = "mbse"
root = "Main"

[[lean_exe]]
name = "mbse-doc-export"
root = "MainDocExport"
supportInterpreter = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-game"
version = "0.1.0"
description = "Reference implementation of the Wymorian Integration Game PoC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
integration_game = ["ONTOLOGY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
